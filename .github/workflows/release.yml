name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Ensure python3.13 is available
        run: |
          # build.sh checks for python3.13 specifically
          if ! command -v python3.13 &>/dev/null; then
            ln -s "$(which python3)" /usr/local/bin/python3.13
          fi
          python3.13 --version

      - name: Build macOS package
        run: bash build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-pkg
          path: chm-docs-*.pkg

      # tar keeps the executable flag, which upload-artifact drops
      - name: Archive app folder for the MCP bundle
        run: tar -czf macos-app.tar.gz -C dist chm-docs

      - name: Upload app folder
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: macos-app.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build Windows installer
        run: .\build.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: chm-docs-*-setup.exe

      - name: Upload app folder
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: dist/chm-docs/

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: macos-pkg

      - uses: actions/download-artifact@v4
        with:
          name: windows-setup

      - uses: actions/download-artifact@v4
        with:
          name: windows-app
          path: windows-app

      - uses: actions/download-artifact@v4
        with:
          name: macos-app

      - name: Create MCP bundle (Windows and macOS)
        run: |
          mkdir macos-app
          tar -xzf macos-app.tar.gz -C macos-app
          python3 make_mcpb.py --windows windows-app --macos macos-app/chm-docs

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            chm-docs-*.pkg
            chm-docs-*-setup.exe
            chm-docs-*.mcpb
          generate_release_notes: true
